name: flutter

on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: datavault_mobile
      - run: flutter analyze
        working-directory: datavault_mobile
      - run: flutter test
        working-directory: datavault_mobile
